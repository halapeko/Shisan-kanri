name: Update portfolio data

on:
  schedule:
    # JST 月〜土 06:30（前営業日の基準価額・終値が反映された後。土曜は金曜の終値を取り込む）
    - cron: "30 21 * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update prices and alerts
        run: node scripts/update_portfolio.mjs

      - name: Commit & push
        run: |
          if git diff --quiet -- data/portfolio.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json
          git commit -m "chore: ポートフォリオ価格・アラート自動更新 ($(date -u +%F))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "競合のためやり直し ($i/3)"; sleep 5
          done
          echo "push に失敗しました（週次レビュー等の更新と競合）"; exit 1
